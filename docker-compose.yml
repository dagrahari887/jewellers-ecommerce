services:
  db:
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: baikunthh_db
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: "no"
    environment:
      DATABASE_URL: mysql://root:1234@db:3306/baikunthh_db
      JWT_SECRET: BAIKUNTHH_LUXURY_SECRET
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules # keep the container's Linux deps, not the committed Windows ones
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: "no"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
